services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: provida-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: provida_user
      POSTGRES_PASSWORD: provida_pass_2024
      POSTGRES_DB: provida_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"  # Puerto externo 5433 para evitar conflicto con PostgreSQL local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - provida-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provida_user -d provida_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Backend API (Express + TypeScript)
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: provida-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://provida_user:provida_pass_2024@postgres:5432/provida_db
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: debug
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - provida-network
    command: npm run dev

  # ========================================
  # Frontend (Next.js)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: provida-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - provida-network
    command: npm run dev

# ========================================
# Networks
# ========================================
networks:
  provida-network:
    driver: bridge
    name: provida-network

# ========================================
# Volumes (persistencia de datos)
# ========================================
volumes:
  postgres_data:
    name: provida-postgres-data

